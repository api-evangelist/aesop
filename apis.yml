name: AESOP
description: AESOP Technology is a clinical AI company building a Clinical Deep Reasoning
  engine that reconstructs, models, and analyzes how clinicians make decisions across
  diagnosis, treatment, medication management, and medical coding. A 2019 spinoff from
  Taipei Medical University now headquartered in San Francisco, AESOP trains on more than
  3.2 billion real-world medical records and 5 million clinical decision pathways to make
  clinical reasoning explicit, traceable, and actionable. Its products DxPrime (diagnostic
  integrity and automated code translation, a qualified solution on Mayo Clinic Platform)
  and Medigator integrate with EHR systems to improve patient safety, coding accuracy, and
  medication management. AESOP is backed by 500 Global, Taiwania Capital, BE Capital, and
  Colopl Next.
